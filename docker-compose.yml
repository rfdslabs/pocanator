services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: plurium-pocanator:latest
    container_name: plurium-pocanator
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - sqlite_data:/app/data
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SUPERUSER_USERNAME=admin
      - DJANGO_SUPERUSER_PASSWORD=admin
      - DJANGO_SUPERUSER_EMAIL=admin@example.com
      - DEBUG=True
      - SECRET_KEY=django-insecure-development-mode-only

volumes:
  static_volume:
  media_volume:
  sqlite_data: